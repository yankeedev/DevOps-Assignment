
services:

    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: my_app

        ports:
            - "5000:5000"
            - "4173:4173"

        environment:
            NODE_ENV: production
            PORT: 5000
            DATABASE_URL: ${DATABASE_URL}

        depends_on:
          db:
            condition: service_healthy

        restart: unless_stopped