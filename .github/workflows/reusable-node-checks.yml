name: Reusable Node checks

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      lockfile:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "20"
      lint-tools:
        required: false
        type: string
        default: ""
      lint-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: ""
      build-command:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: ${{ inputs.app-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node ${{ inputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Install temporary lint tools
        if: inputs.lint-tools != ''
        run: npm install --no-save --package-lock=false ${{ inputs.lint-tools }}
        working-directory: ${{ inputs.working-directory }}

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}
        working-directory: ${{ inputs.working-directory }}

      - name: Run tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
        working-directory: ${{ inputs.working-directory }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
        working-directory: ${{ inputs.working-directory }}
