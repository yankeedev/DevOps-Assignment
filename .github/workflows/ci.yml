name: AgriRent CI

on:
  push:
    branches-ignore:
      - main
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.app-name }} checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-name: Backend
            working-directory: backend
            lockfile: backend/package-lock.json
            lint-tools: eslint@^9 @eslint/js@^9 globals typescript-eslint
            lint-command: npx eslint src
            test-command: ""
            build-command: npm run build
          - app-name: Frontend
            working-directory: frontend
            lockfile: frontend/package-lock.json
            lint-tools: eslint@^9 @eslint/js@^9 globals typescript-eslint eslint-plugin-react jiti stylelint stylelint-config-standard
            lint-command: |
              npx eslint src
              npx stylelint "src/**/*.css"
            test-command: npm test
            build-command: npm run build
    uses: ./.github/workflows/reusable-node-checks.yml
    with:
      app-name: ${{ matrix.app-name }}
      working-directory: ${{ matrix.working-directory }}
      lockfile: ${{ matrix.lockfile }}
      lint-tools: ${{ matrix.lint-tools }}
      lint-command: ${{ matrix.lint-command }}
      test-command: ${{ matrix.test-command }}
      build-command: ${{ matrix.build-command }}

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build Docker image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t my-app:ci .
