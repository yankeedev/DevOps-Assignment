name: Main Branch CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: Validate Codebase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check workspace structure
        run: |
          echo "Checking project structure for AgriRent..."
          ls -la

  checks:
    name: ${{ matrix.app-name }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-name: Backend
            working-directory: backend
            lockfile: backend/package-lock.json
            lint-tools: eslint@^9 @eslint/js@^9 globals typescript-eslint
            lint-command: npx eslint src
            test-command: ""
            build-command: npm run build
          - app-name: Frontend
            working-directory: frontend
            lockfile: frontend/package-lock.json
            lint-tools: eslint@^9 @eslint/js@^9 globals typescript-eslint eslint-plugin-react jiti stylelint stylelint-config-standard
            lint-command: |
              npx eslint src
              npx stylelint "src/**/*.css"
            test-command: npm test
            build-command: npm run build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Dependencies
        run: npm ci
        working-directory: ${{ matrix.working-directory }}

      - name: Lint tools
        if: matrix.lint-tools != ''
        run: npm install --no-save --package-lock=false ${{ matrix.lint-tools }}
        working-directory: ${{ matrix.working-directory }}

      - name: Lint
        if: matrix.lint-command != ''
        run: ${{ matrix.lint-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Tests
        if: matrix.test-command != ''
        run: ${{ matrix.test-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Build
        if: matrix.build-command != ''
        run: ${{ matrix.build-command }}
        working-directory: ${{ matrix.working-directory }}

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build Docker image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t my-app:ci .
