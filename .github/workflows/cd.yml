name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        #read AWS auths

env:
  AWS_REGION: ${{ vars.AWS_REGION  || 'eu-north-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'agrirent-app' }}
  IMAGE_TAG: ${{ github.sha }}  
  TF_woRKING_DIR: terraform

jobs:
  check:
    if: github.event.pull_request.merged == true
    name: ${{ matrix.app-name }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-name: backend
            working-directory: backend
            lockfile: backend/package-lock.json
            lint-tools: eslint@^9 @eslint/js@^9 globals typescript-eslint
            lint-command: npx eslint src
            test-command: ""
            build-command: npm run build
          - app-name: frontend
            working-directory: frontend
            lockfile: frontend/package-lock.json
            lint-tools: eslint@^9 @eslint/js@^9 globals typescript-eslint eslint-plugin-react jiti stylelint stylelint-config-standard
            lint-command: |
              npx eslint src
              npx stylelint "src/**/*.css"
            test-command: npm test
            build-command: npm run build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.working-directory }}
      - name: dependencies audit
        run: npm audit   --audit-level=high
        working-directory: ${{ matrix.working-directory }} 

      - name: install lint tools
        if: matrix.lint-tools != ''
        run: npm install --nosave ${{ matrix.lint-tools }}
        working-directory: ${{ matrix.working-directory }}

      - name: Lint
        if: matrix.lint-command != ''
        run: ${{ matrix.lint-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Tests
        if: matrix.test-command != ''
        run: ${{ matrix.test-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Build
        if: matrix.build-command != ''
        run: ${{ matrix.build-command }}
        working-directory: ${{ matrix.working-directory }}


  iac_scan:
    if: github.event.pull_request.merged == true
    name: IaC security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          soft_fail: false

      
  build_scan_push:
    name: build, verify and deploy image
    runs-on: ubuntu-latest
    timeout-minutes: 37
    needs:
      - check
      - iac_scan
    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Verify AWS account
        run: |
          echo "Checking AWS account..."
          aws sts get-caller-identity

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          if [ "$ACCOUNT_ID" != "812114844665" ]; then
            echo "ERROR: GitHub Actions is connected to the wrong AWS account!"
            exit 1
          fi

          echo "SUCCESS: GitHub Actions is connected to the correct AWS account."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image url
        id: image
        shell: bash
        run: |
          registry=${{ steps.login-ecr.outputs.registry }}
          image_url="${registry}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "image_url=${image_url}" >> "$GITHUB_ENV"
          echo "image_url=${image_url}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: hashFiles('Dockerfile') != ''
        run: |
          docker build --no-cache -t "$image_url" -t "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" .


      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.image_url }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Push Docker img
        run: |
          docker push "$image_url"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build_scan_push
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate server IP variables
        env:
          BASTION_IP: ${{ vars.BASTION_IP }}
          APP_PRIVATE_IP: ${{ vars.APP_PRIVATE_IP }}
        run: |
          if [ -z "${BASTION_IP:-}" ]; then
            echo "ERROR: BASTION_IP is missing. Set it as a repository or production environment variable."
            exit 1
          fi

          if [ -z "${APP_PRIVATE_IP:-}" ]; then
            echo "ERROR: APP_PRIVATE_IP is missing. Set it as a repository or production environment variable."
            exit 1
          fi

          case "$BASTION_IP" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.30.*|172.31.*)
              echo "ERROR: BASTION_IP ($BASTION_IP) is a private address. GitHub-hosted runners cannot reach it. Use the bastion's PUBLIC IP."
              exit 1
              ;;
          esac

          echo "Bastion IP and application private IP are configured."

      - name: Generate Ansible inventory
        working-directory: ansible
        env:
          BASTION_IP: ${{ vars.BASTION_IP }}
          APP_PRIVATE_IP: ${{ vars.APP_PRIVATE_IP }}
        run: |
          cat > inventory/hosts.ini <<EOF
          [bastion]
          agrirent-bastion ansible_host=${BASTION_IP} ansible_user=ec2-user

          [app]
          agrirent-app ansible_host=${APP_PRIVATE_IP} ansible_user=ec2-user ansible_ssh_common_args='-o ProxyJump=ec2-user@${BASTION_IP}'
          EOF
          echo "Generated inventory:"
          cat inventory/hosts.ini
      - name: install ansible and dependencies
        run: |
          pipx install --include-deps ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure SSH for Ansible
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Test SSH connectivity
        shell: bash
        env:
          BASTION_IP: ${{ vars.BASTION_IP }}
          APP_PRIVATE_IP: ${{ vars.APP_PRIVATE_IP }}
        run: |
          echo "===== TEST 1: CONNECT TO BASTION ====="

          ssh -vvv -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            ec2-user@"$BASTION_IP" "echo BASTION CONNECTION SUCCESSFUL"

          echo "===== TEST 2: CONNECT TO APPLICATION ====="

          ssh -vvv -i ~/.ssh/id_rsa \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o ProxyJump=ec2-user@"$BASTION_IP" \
            ec2-user@"$APP_PRIVATE_IP" "echo APPLICATION CONNECTION SUCCESSFUL"

      - name: Configure Ansible Vault password
        shell: bash
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.ansible_vault_pass
          chmod 600 ~/.ansible_vault_pass

      - name: run ansible playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          IMAGE_URL: ${{ needs.build_scan_push.outputs.image_url }}
          DATABASE_SECRET_ARN: ${{ vars.DATABASE_SECRET_ARN }}
        run: |
          extra_vars=(-e "app_image=${IMAGE_URL}")

          if [ -n "${DATABASE_SECRET_ARN:-}" ]; then
            extra_vars+=(-e "database_secret_arn=${DATABASE_SECRET_ARN}")
          fi

          ansible-playbook site.yml "${extra_vars[@]}"
