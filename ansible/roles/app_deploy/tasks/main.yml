---
# ---------------------------------------------------------------------------
# Deploy the AgriRent stack: write .env, copy compose file, bring up services,
# wait for /health. Uses block/rescue to capture container logs on failure.
#
# Idempotency:
#   - .env is rendered via template with no_log (secrets never in ansible output)
#   - compose file copy is content-addressed; unchanged file → no change
#   - docker_compose_v2 with pull: missing only pulls images not already local
#   - health wait uses changed_when: false
#
# Handler `Restart application stack` fires only when .env or compose file
# changes. That's the correct semantic: if only the image tag changes, the
# compose module handles it; if config changes, we need an explicit restart
# so running containers pick up the new env vars.
# ---------------------------------------------------------------------------

- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render application environment file from vault
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart application stack

- name: Copy docker-compose file to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart application stack

- name: Bring up the application stack
  block:
    - name: Deploy with docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: missing

    - name: Wait for the application health endpoint
      ansible.builtin.uri:
        url: "{{ app_health_url }}"
        status_code: 200
        timeout: 5
      register: app_health
      retries: "{{ app_health_retries }}"
      delay: "{{ app_health_delay }}"
      until: app_health.status == 200
      changed_when: false

  rescue:
    - name: Capture application stack logs on failure
      ansible.builtin.command:
        cmd: "docker compose logs --tail=200"
        chdir: "{{ app_dir }}"
      register: app_logs
      changed_when: false
      failed_when: false

    - name: Fail with application logs visible
      ansible.builtin.fail:
        msg: |
          Application stack failed to come up. Container logs follow.

          {{ app_logs.stdout }}