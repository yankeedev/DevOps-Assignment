---
# Deploy the AgriRent stack: fetch RDS password from Secrets Manager,

# Security invariants:
#  - does not show up in vault.yml, Terraform state or Ansible.
#  - output. Retrieved from Secrets Manager using IAM role of the instance.
#  - No Log: true - The content of the rendered .env is the password + JWT.
#  - secrets) will not be printed to stdout or CI logs.
#   - changes the image tag without affecting compose image `${APP_IMAGE}` defined in .env file.

# Idempotency:
#   - no content change on the already processed template tasks, no change in the result
#   - docker_compose_v2 with pull: missing skipped already-existing images
#   - The wait for health status change is disabled 

- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"


# RDS passwprd retrieval

- name: Fetch RDS master credentials from Secrets Manager
  ansible.builtin.command:
    cmd: >
      aws secretsmanager get-secret-value
      --region {{ aws_region }}
      --secret-id {{ database_secret_arn }}
      --query SecretString --output text
  register: rds_secret_raw
  changed_when: false
  no_log: true
  failed_when: false

- name: Fail with Secrets Manager error details
  ansible.builtin.fail:
    msg: >-
      Unable to fetch RDS secret {{ database_secret_arn }} in {{ aws_region }}:
      {{ rds_secret_raw.stderr | default('unknown error') }}
  when: rds_secret_raw.rc != 0

- name: Parse RDS credential JSON
  ansible.builtin.set_fact:
    rds_credentials: "{{ rds_secret_raw.stdout | from_json }}"
  no_log: true

- name: Verify RDS credential JSON has required keys
  ansible.builtin.assert:
    that:
      - rds_credentials.username is defined
      - rds_credentials.password is defined
      - rds_credentials.password | length > 8
    fail_msg: >-
      RDS secret JSON structure is unexpected. Expected keys
      `username` and `password`. Check with:
      aws secretsmanager get-secret-value --secret-id {{ database_secret_arn }}
  no_log: true

# Render .env from vault

- name: Render application environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart application stack

- name: Copy docker-compose file to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart application stack

- name: Copy Prometheus configuration file to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../prometheus/prometheus.yml"
    dest: "{{ app_dir }}/prometheus/prometheus.yml"
    mode: "0644"

- name: Copy Grafana configuration directory to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../grafana"
    dest: "{{ app_dir }}/grafana"
    mode: "0644"

# Bring up the stack with health gate and failure log capture

- name: Bring up the application stack
  block:
    - name: Deploy with docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: missing

    - name: Wait for the application health endpoint
      ansible.builtin.uri:
        url: "{{ app_health_url }}"
        status_code: 200
        timeout: 5
      register: app_health
      retries: "{{ app_health_retries }}"
      delay: "{{ app_health_delay }}"
      until: app_health.status == 200
      changed_when: false

  rescue:
    - name: Capture application stack logs on failure
      ansible.builtin.command:
        cmd: "docker compose logs --tail=200"
        chdir: "{{ app_dir }}"
      register: app_logs
      changed_when: false
      failed_when: false

    - name: Fail with application logs visible
      ansible.builtin.fail:
        msg: |
          Application stack failed to come up. Container logs follow.

          {{ app_logs.stdout }}